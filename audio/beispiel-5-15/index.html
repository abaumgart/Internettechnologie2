<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beispiel 5.13 – Mehrere Pflanzen als Objekte</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
</head>
<body>
  <main class="seite">
    <header class="kopfbereich">
      <h1>Beispiel 5.13 – Fünf Pflanzen als Objekte</h1>
      <p>
        In diesem Beispiel werden fünf Objekte der Klasse <strong>Pflanze</strong> erzeugt.
        Jede Pflanze besitzt eine eigene Grundfarbe und eine eigene Grundgröße.
        Gleichzeitig besteht jede Pflanze aus vielen Objekten der Klasse <strong>Blatt</strong>.
      </p>
    </header>

    <section id="steuerung" class="steuerung"></section>
  </main>

  <script src="sketch.js"></script>
</body>
</html>
